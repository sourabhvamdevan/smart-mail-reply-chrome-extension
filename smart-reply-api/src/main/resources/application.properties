spring.application.name=smart-reply-api
server.port=8082

# Which LLM to use by default: groq | gemini (a request can override via "provider")
llm.provider=${LLM_PROVIDER:groq}

# Groq (OpenAI-compatible)
groq.api.key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}

# Gemini (optional, kept as an alternative)
gemini.api.url=${GEMINI_URL:}
gemini.api.key=${GEMINI_KEY:}

# Tavily web search (optional)
tavily.api.key=${TAVILY_API_KEY:}
tavily.default-enabled=${TAVILY_DEFAULT_ENABLED:false}
tavily.max-results=3
